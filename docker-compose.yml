version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

    _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas psycopg2-binary python-dotenv"

    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}

    DB_HOST: weather-postgres
    DB_PORT: 5432
    DB_NAME: weather_pipeline
    DB_USER: weather_user
    DB_PASSWORD: weather_pass

  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./raw_data:/opt/airflow/raw_data
    - ./clean_data:/opt/airflow/clean_data
    - ./logs:/opt/airflow/logs

  depends_on:
    airflow-postgres:
      condition: service_healthy


services:


  # ======================================
  # WEATHER DATABASE
  # ======================================

  weather-postgres:

    image: postgres:15

    container_name: weather_db

    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
      POSTGRES_DB: weather_pipeline

    ports:
      - "5432:5432"

    volumes:
      - weather_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weather_user", "-d", "weather_pipeline"]
      interval: 5s
      retries: 5


  # ======================================
  # AIRFLOW METADATA DATABASE
  # ======================================

  airflow-postgres:

    image: postgres:15

    container_name: airflow_metadb

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_meta:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5


  # ======================================
  # AIRFLOW INITIALIZATION
  # ======================================

  airflow-init:

    <<: *airflow-common

    container_name: airflow_init

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "


  # ======================================
  # AIRFLOW WEBSERVER
  # ======================================

  airflow-webserver:

    <<: *airflow-common

    container_name: airflow_webserver

    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      - airflow-init


  # ======================================
  # AIRFLOW SCHEDULER
  # ======================================

  airflow-scheduler:

    <<: *airflow-common

    container_name: airflow_scheduler

    command: scheduler

    depends_on:
      - airflow-init


volumes:

  weather_data:

  airflow_meta: